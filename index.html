    <!-- Inject Buffer polyfill before any modules load -->
    <script>
      // Early Buffer polyfill injection
      (function() {
        if (typeof globalThis.Buffer === 'undefined') {
          // Define a basic Buffer shim that will be replaced by the full polyfill
          globalThis.Buffer = { 
            from: function() { return new Uint8Array(); },
            alloc: function() { return new Uint8Array(); }
          };
        }
        if (typeof globalThis.process === 'undefined') {
          globalThis.process = { env: {}, browser: true };
        }
      })();
    </script>
